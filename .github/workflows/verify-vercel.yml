name: Verifica sito Vercel online
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-vercel.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'vercel.json'
      - '.github/workflows/verify-vercel.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Controlla il sito reale
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Prova URL, pagina e asset pubblicati
        shell: bash
        run: |
          set -euo pipefail
          base="https://oggisimangia.vercel.app"
          echo "Controllo: $base/"
          for attempt in 1 2 3 4 5 6; do
            http_code="$(curl -L -sS -o /tmp/oggisimangia-live.html -w '%{http_code}' --max-time 25 "$base/" || true)"
            echo "Tentativo $attempt: HTTP $http_code"
            if [ "$http_code" = "200" ] && grep -q 'OggiSiMangia' /tmp/oggisimangia-live.html; then
              echo "PASS: home page OggiSiMangia pubblicata"
              break
            fi
            if [ "$attempt" = 6 ]; then
              echo "::error::Il sito non restituisce l'anteprima OggiSiMangia (ultima risposta HTTP: $http_code)."
              head -c 600 /tmp/oggisimangia-live.html || true
              exit 1
            fi
            sleep 10
          done
          for file in app.js style.css manifest.webmanifest icon.svg; do
            code="$(curl -L -sS -o "/tmp/oggisimangia-$file" -w '%{http_code}' --max-time 25 "$base/$file" || true)"
            echo "$file HTTP $code, dimensione: $(wc -c < "/tmp/oggisimangia-$file") byte"
            [ "$code" = "200" ] && [ -s "/tmp/oggisimangia-$file" ] || {
              echo "::error::Manca la risorsa $file"; exit 1;
            }
          done
          if cmp -s /tmp/oggisimangia-app.js docs/app.js; then
            echo "PASS: il JavaScript su Vercel coincide con il codice attuale di GitHub"
          else
            echo "::error::Il JavaScript su Vercel non coincide con quello di GitHub"
            exit 1
          fi
          echo "PASS: URL permanente, HTML, CSS, JavaScript, icona e manifesto"
