name: Android APK
on:
  push:
    branches: [main, artifact/voice-assistant-v1.13.0-beta1, artifact/voice-guides-v1.13.0-beta2, artifact/on-device-functiongemma-v1.13.0-beta3]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: python3 scripts/check_migration.py
      - run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug
  signed-apk:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'alfiericristiano-bit' && github.event.pull_request.head.ref == 'artifact/on-device-functiongemma-v1.13.0-beta3' || github.event.pull_request.head.ref == 'artifact/voice-guides-v1.13.0-beta2')
    needs: checks
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/../oggisimangia.jks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Require the persistent signing certificate
        run: bash scripts/check_signing.sh
      - run: gradle --no-daemon :app:assembleRelease :app:assembleDebug
      - name: Build signed previous 1.12 APK for upgrade regression
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin refs/heads/feat/context-guide-pages-v1.12.0
          git worktree add --detach ../oggisimangia-previous FETCH_HEAD
          # Apply the compiler-only fix in the disposable historical worktree;
          # never modify the preserved 1.12 branch or its runtime behavior.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("../oggisimangia-previous/app/src/main/java/it/oggisimangia/app/MainActivity.kt")
          content = path.read_text(encoding="utf-8")
          old = 'contentDescription = "Apri guida della schermata " + title\n            background = outlined(familyPale, 13f)'
          new = 'contentDescription = "Apri guida della schermata " + title\n            this.background = outlined(familyPale, 13f)'
          assert content.count(old) == 1, "Historical guide compiler fix not found"
          path.write_text(content.replace(old, new), encoding="utf-8")
          PY
          (cd ../oggisimangia-previous && gradle --no-daemon :app:assembleDebug)
          mkdir -p build/update-check
          cp ../oggisimangia-previous/app/build/outputs/apk/debug/app-debug.apk build/update-check/previous-112-debug.apk
          git worktree remove --force ../oggisimangia-previous
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Free unused native build tools for emulator userdata
        shell: bash
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$sdk_root"
          rm -rf "$sdk_root/ndk" "$sdk_root/cmake"
          df -h "$sdk_root"
      - name: Verify update without uninstalling and preserve app data
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disk-size: 2048M
          emulator-boot-timeout: 180
          script: bash scripts/verify_update.sh
      - name: Package verified release
        id: version
        shell: bash
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -1 | cut -d '"' -f2)
          test -n "$VERSION"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/OggiSiMangia-v${VERSION}.apk"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: OggiSiMangia-v${{ steps.version.outputs.name }}-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90
      - name: Upload calendar check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-check
          path: build/calendar-check/
          if-no-files-found: ignore
      - name: Remove signing material
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH" "$RUNNER_TEMP/signing-cert.der"
