name: Android APK
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Tipo di compilazione: rapida o completa"
        required: true
        default: quick
        type: choice
        options:
          - quick
          - full
permissions:
  contents: read
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  signed-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/../oggisimangia.jks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check database migrations without emulator
        run: python3 scripts/check_migration.py
      - name: Require persistent signing certificate
        run: bash scripts/check_signing.sh
      - name: Unit tests and lint (full only)
        if: ${{ inputs.mode == 'full' }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug
      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Build debug APK for update test (full only)
        if: ${{ inputs.mode == 'full' }}
        run: gradle --no-daemon :app:assembleDebug
      - name: Build previously installed beta7 debug APK (full only)
        if: ${{ inputs.mode == 'full' }}
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin refs/heads/artifact/remove-voice-assistant-v1.13.0-beta7
          git worktree add --detach ../oggisimangia-previous FETCH_HEAD
          (cd ../oggisimangia-previous && gradle --no-daemon :app:assembleDebug)
          mkdir -p build/update-check
          cp ../oggisimangia-previous/app/build/outputs/apk/debug/app-debug.apk build/update-check/previous-beta7-debug.apk
          git worktree remove --force ../oggisimangia-previous
      - name: Verify restored feature set
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle=Path('app/build.gradle.kts').read_text()
          assert 'versionCode = providers.gradleProperty("verificationVersionCode").orNull?.toInt() ?: 35' in gradle
          assert 'versionName = "1.10.0-ripartenza"' in gradle
          assert 'com.google.mlkit:text-recognition:' in gradle
          assert 'litertlm' not in gradle
          assert 'genai-prompt' not in gradle
          types=Path('app/src/main/java/it/oggisimangia/app/RecipeTypeFilter.kt').read_text()
          for x in ('Vegana','Vegetariana','Con carne','Con pesce','Senza glutine','Senza lattosio'):
              assert x in types, x
          PY
      - name: Enable emulator acceleration (full only)
        if: ${{ inputs.mode == 'full' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Free unused native build tools (full only)
        if: ${{ inputs.mode == 'full' }}
        shell: bash
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$sdk_root"
          rm -rf "$sdk_root/ndk" "$sdk_root/cmake"
      - name: Verify update and preserve app data (full only)
        if: ${{ inputs.mode == 'full' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disk-size: 2048M
          emulator-boot-timeout: 180
          script: bash scripts/verify_update.sh
      - name: Package release
        id: version
        shell: bash
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -1 | cut -d '"' -f2)
          test -n "$VERSION"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/OggiSiMangia-v${VERSION}.apk"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: OggiSiMangia-v${{ steps.version.outputs.name }}-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing material
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH" "$RUNNER_TEMP/signing-cert.der"
