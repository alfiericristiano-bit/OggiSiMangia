name: Android APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: python3 scripts/check_migration.py
      - run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug
  signed-apk:
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/../oggisimangia.jks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Require the persistent signing certificate
        run: bash scripts/check_signing.sh
      - run: gradle --no-daemon :app:assembleRelease :app:assembleDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify update without uninstalling and preserve app data
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          script: bash scripts/verify_update.sh
      - name: Package verified release
        id: version
        shell: bash
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -1 | cut -d '"' -f2)
          test -n "$VERSION"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/OggiSiMangia-v${VERSION}.apk"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: OggiSiMangia-v${{ steps.version.outputs.name }}-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90
      - name: Upload calendar check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-check
          path: build/calendar-check/
          if-no-files-found: ignore
      - name: Remove signing material
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH" "$RUNNER_TEMP/signing-cert.der"
