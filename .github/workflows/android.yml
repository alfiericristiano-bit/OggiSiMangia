name: Android APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check schema migration
        run: python3 scripts/check_migration.py
      - name: Test, lint and assemble preview
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: Prepare persistent signing when configured
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            test -n "$ANDROID_STORE_PASSWORD"
            test -n "$ANDROID_KEY_ALIAS"
            test -n "$ANDROID_KEY_PASSWORD"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oggisimangia.jks"
            chmod 600 "$RUNNER_TEMP/oggisimangia.jks"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/oggisimangia.jks"
            gradle --no-daemon :app:assembleRelease
          fi
      - name: Name APK after app version
        id: version
        shell: bash
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -1 | cut -d '"' -f2)
          test -n "$VERSION"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/OggiSiMangia-v${VERSION}-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/OggiSiMangia-v${VERSION}-release.apk"
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Publish versioned APK
        uses: actions/upload-artifact@v4
        with:
          name: OggiSiMangia-v${{ steps.version.outputs.name }}-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
