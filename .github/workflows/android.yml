name: Android APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assemble Android debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Name APK after app version
        id: version
        shell: bash
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -1 | cut -d '"' -f2)
          test -n "$VERSION"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/OggiSiMangia-v${VERSION}-debug.apk"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Publish versioned APK
        uses: actions/upload-artifact@v4
        with:
          name: OggiSiMangia-v${{ steps.version.outputs.name }}-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90
