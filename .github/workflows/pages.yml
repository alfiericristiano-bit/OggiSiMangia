name: Anteprima web - test Vercel
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'vercel.json'
      - 'scripts/test_pages_preview.cjs'
      - 'scripts/test_vercel_config.cjs'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'vercel.json'
      - 'scripts/test_pages_preview.cjs'
      - 'scripts/test_vercel_config.cjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Verifica anteprima web e Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Controllo sintassi JavaScript
        run: node --check docs/app.js
      - name: Test del calendario e ricettario web
        run: node scripts/test_pages_preview.cjs
      - name: Verifica configurazione Vercel
        run: node scripts/test_vercel_config.cjs
