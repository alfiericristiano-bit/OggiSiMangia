name: Anteprima web GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/test_pages_preview.cjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  validate:
    name: Verifica anteprima web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verifica sintassi JavaScript
        run: node --check docs/app.js
      - name: Test interattivi anteprima
        run: node scripts/test_pages_preview.cjs
  deploy:
    name: Pubblica su GitHub Pages (se attivato)
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Controlla se GitHub Pages è già attivato
        id: enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          if [ "$status" = '200' ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Anteprima web pronta; attiva GitHub Pages in Settings > Pages > Source: GitHub Actions, poi rilancia questo workflow.'
          fi
      - name: Configura GitHub Pages
        if: steps.enabled.outputs.ready == 'true'
        uses: actions/configure-pages@v5
      - name: Carica sito statico
        if: steps.enabled.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/
      - name: Pubblica sito
        if: steps.enabled.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
